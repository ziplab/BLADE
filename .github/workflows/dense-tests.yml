name: Dense training source checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check release source files
        run: python scripts/check_release.py
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/dense.txt -r requirements/dev.txt
          python -m pip install --no-deps -e .
      - name: Check modern package style
        run: ruff check video_blade tests scripts/check_release.py
      - name: Run CPU regression tests
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: python -m pytest -q
